[package]
name = "chesscraft"
version = "0.1.0"
edition = "2021"
description = "A system-first chess opening trainer: Modern Defence and London System, built and move-checked by Stockfish, drilled with spaced repetition."
license = "MIT"
repository = "https://github.com/pink-bourbon-estate/toolkits"
build = "build.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11"] }
egui = "0.31"
shakmaty = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
webbrowser = "1"
ureq = { version = "3", features = ["platform-verifier"] }
sha2 = "0.10"
rand = "0.8"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
