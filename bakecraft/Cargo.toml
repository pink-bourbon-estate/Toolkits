[package]
name = "bakecraft"
version = "0.1.0"
edition = "2021"
description = "A bake planner: ingredient calculator, clock-time timeline with alarms and a dough-temperature helper, built from averaged school and bakery formulas."
license = "MIT"
repository = "https://github.com/pink-bourbon-estate/toolkits"
build = "build.rs"

[dependencies]
# eframe/egui draw the window. "glow" = OpenGL drawing, "x11" = Linux window support.
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11"] }
egui = "0.31"
# serde/serde_json save and load plans and settings as .json files.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# chrono does the clock-time maths (dates, hours, minutes).
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
# dirs finds the right per-user folder for settings on each operating system.
dirs = "6"
# webbrowser opens links and folders.
webbrowser = "1"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
