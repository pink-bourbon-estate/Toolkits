[package]
name = "video-editing-toolkit"
version = "0.1.0"
edition = "2021"
description = "Compress video, pull out audio and grab a frame every N seconds: three small ffmpeg helpers in one program, with a window and a command line."
license = "MIT"
repository = "https://github.com/pink-bourbon-estate/toolkits"
build = "build.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts", "x11"] }
egui = "0.31"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
webbrowser = "1"
ureq = { version = "3", features = ["platform-verifier"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
rfd = "0.15"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
