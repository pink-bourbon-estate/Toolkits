name: uk-tree-map
on:
  push:
    branches: [main]
    paths: ['uk-tree-map/**', '.github/workflows/uk-tree-map.yml', '.gitleaks.toml']
  pull_request:
    paths: ['uk-tree-map/**', '.github/workflows/uk-tree-map.yml', '.gitleaks.toml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (keys, tokens, passwords, personal emails)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1

  test:
    needs: secrets
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: uk-tree-map
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: uk-tree-map/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
